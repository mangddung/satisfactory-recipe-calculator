<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satisfactory — Phase 0 관리자</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #e0e0e0; min-height: 100vh; }

    header {
      background: #1a1a2e; padding: 12px 24px;
      display: flex; align-items: center; gap: 16px;
      border-bottom: 2px solid #e8b84b;
    }
    header h1 { font-size: 1.1rem; color: #e8b84b; }

    .btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .btn-primary { background: #e8b84b; color: #111; }
    .btn-sm { padding: 3px 10px; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .tabs { display: flex; gap: 4px; padding: 12px 24px 0; border-bottom: 1px solid #333; background: #161616; }
    .tab { padding: 8px 18px; border-radius: 6px 6px 0 0; cursor: pointer; background: #222; color: #aaa; border: 1px solid #333; border-bottom: none; font-size: 0.9rem; }
    .tab.active { background: #1a1a2e; color: #e8b84b; border-color: #e8b84b; }

    .panel { display: none; padding: 20px 24px; }
    .panel.active { display: block; }

    #validate-banner { padding: 10px 16px; font-size: 0.85rem; display: none; }
    .banner-ok   { background: #1a3a1a; border-bottom: 1px solid #2ecc71; color: #2ecc71; }
    .banner-fail { background: #3a1a1a; border-bottom: 1px solid #e74c3c; color: #f8a0a0; }
    .banner-warn { background: #3a2e10; border-bottom: 1px solid #e8b84b; color: #e8b84b; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar input[type=text] { padding: 6px 12px; background: #222; border: 1px solid #444; border-radius: 4px; color: #e0e0e0; width: 260px; font-size: 0.85rem; }
    .toolbar select { padding: 6px 10px; background: #222; border: 1px solid #444; border-radius: 4px; color: #e0e0e0; font-size: 0.85rem; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge-unclassified    { background: #5a2020; color: #f08080; }
    .badge-miner           { background: #1e3a1e; color: #7ed882; }
    .badge-oil_extractor   { background: #2e2010; color: #d4a050; }
    .badge-water_extractor { background: #102038; color: #70b8e8; }
    .badge-resource_well   { background: #2a2010; color: #c8c060; }
    .badge-manufactured    { background: #1a1a3a; color: #8888e8; }
    .badge-byproduct       { background: #2a2a2a; color: #aaaaaa; }
    .badge-natural         { background: #1a2e1a; color: #88c888; }
    .badge-other           { background: #2a1a3a; color: #c088e8; }
    .badge-production      { background: #1a1a3a; color: #8888e8; }
    .badge-construction    { background: #1a2e1a; color: #88c888; }
    .badge-manual          { background: #2a1a10; color: #d4a050; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #1a1a2e; color: #e8b84b; text-align: left; padding: 8px 10px; border-bottom: 2px solid #333; }
    td { padding: 7px 10px; border-bottom: 1px solid #222; vertical-align: middle; }
    tr.row-clickable { cursor: pointer; }
    tr.row-clickable:hover td { background: #1e1e2a; }
    tr.row-unclassified td { background: #1f1010; }
    tr.row-unclassified:hover td { background: #2a1a1a; }

    .item-icon { width: 52px; height: 52px; object-fit: contain; background: #1a1a1a; border-radius: 6px; border: 1px solid #333; display: block; }
    .item-icon-placeholder { width: 52px; height: 52px; background: #1a1a1a; border-radius: 6px; border: 1px solid #2a2a2a; display: inline-flex; align-items: center; justify-content: center; color: #333; font-size: 22px; }

    .classify-select { padding: 3px 8px; background: #222; border: 1px solid #555; border-radius: 4px; color: #e0e0e0; font-size: 0.8rem; }
    .classify-select.changed { border-color: #e8b84b; }

    .stat-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-card { background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 12px 20px; min-width: 130px; }
    .stat-card .label { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; color: #e8b84b; }
    .stat-card.danger .value { color: #e74c3c; }

    .pagination { display: flex; gap: 6px; align-items: center; margin-top: 12px; font-size: 0.85rem; }
    .page-btn { padding: 4px 10px; background: #222; border: 1px solid #444; border-radius: 4px; cursor: pointer; color: #ccc; }
    .page-btn.active { background: #e8b84b; color: #111; border-color: #e8b84b; }
    .page-btn:disabled { opacity: 0.4; cursor: default; }

    /* 공통 모달 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1a1a2e; border: 1px solid #e8b84b; border-radius: 10px; padding: 24px; max-width: 860px; width: 95%; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .modal-title { font-size: 1.2rem; font-weight: 700; color: #e8b84b; }
    .modal-sub   { margin-top: 5px; font-size: 0.85rem; color: #888; }

    /* 아이템 상세 */
    .item-detail-header { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 24px; }
    .item-detail-icon { width: 80px; height: 80px; object-fit: contain; background: #111; border: 1px solid #333; border-radius: 8px; flex-shrink: 0; }
    .item-detail-icon-ph { width: 80px; height: 80px; background: #111; border: 1px solid #2a2a2a; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #333; font-size: 36px; flex-shrink: 0; }
    .item-detail-title  { font-size: 1.3rem; font-weight: 700; color: #e0e0e0; }
    .item-detail-badges { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
    .item-detail-id     { margin-top: 5px; font-family: monospace; font-size: 0.78rem; color: #555; }

    .detail-section { margin-bottom: 20px; }
    .detail-section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: #555; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #222; }
    .detail-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 0.85rem; }
    .detail-key   { color: #666; }
    .detail-value { color: #ccc; word-break: break-all; font-family: monospace; font-size: 0.82rem; }
    .detail-value.hi { color: #e8b84b; font-weight: 600; font-family: system-ui; }

    .desc-box { background: #111; border: 1px solid #222; border-radius: 6px; padding: 10px 14px; font-size: 0.85rem; color: #bbb; line-height: 1.6; white-space: pre-wrap; }

    .recipe-chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .recipe-chip { background: #111; border: 1px solid #2a2a2a; border-radius: 4px; padding: 3px 10px; font-size: 0.82rem; color: #aaa; cursor: pointer; }
    .recipe-chip:hover { border-color: #e8b84b; color: #e8b84b; }

    /* 레시피 모달 플로우 */
    .recipe-flow { display: flex; align-items: flex-start; gap: 12px; }
    .flow-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .flow-col-label { font-size: 0.72rem; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .flow-arrow { font-size: 1.6rem; color: #e8b84b; flex-shrink: 0; padding-top: 28px; }
    .flow-center { flex-shrink: 0; min-width: 140px; display: flex; flex-direction: column; }
    .recipe-center-card { background: #111; border: 2px solid #e8b84b; border-radius: 8px; padding: 12px 16px; text-align: center; margin-top: 22px; }
    .recipe-center-name     { font-size: 0.9rem; font-weight: 600; color: #ccc; }
    .recipe-center-duration { font-size: 1rem; font-weight: 700; color: #e8b84b; margin-top: 6px; }

    .item-flow-card { display: flex; align-items: center; gap: 10px; background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 8px 12px; }
    .item-flow-card:hover { border-color: #444; }
    .item-flow-icon { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
    .item-flow-icon-ph { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; color: #333; font-size: 20px; flex-shrink: 0; }
    .item-flow-info  { flex: 1; min-width: 0; }
    .item-flow-name  { font-size: 0.85rem; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-flow-amount { font-size: 0.9rem; font-weight: 700; color: #e8b84b; margin-top: 2px; }

    .byproduct-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid #2a2a2a; }
    .byproduct-label { font-size: 0.72rem; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .byproduct-cards { display: flex; flex-wrap: wrap; gap: 8px; }
    .byproduct-cards .item-flow-card { flex: 0 0 auto; min-width: 180px; }

    /* 체인 LR 트리 */
    .lr-chain { overflow-x: auto; overflow-y: visible; padding: 4px 0 12px; }
    .lr-node { display: flex; align-items: center; gap: 5px; padding: 3px 0; }
    .lr-col-group { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
    /* 각 레시피 재료 그룹 — 건물 단위 경계 */
    .lr-ing-group {
      border: 1px solid #2a3a4a;
      border-radius: 7px;
      padding: 5px 7px;
      background: rgba(10,15,30,0.6);
      gap: 4px;
    }
    .lr-arrow { color: #e8b84b; font-size: 1rem; flex-shrink: 0; padding: 0 2px; line-height: 1; }
    .lr-item-card { display: flex; align-items: center; gap: 7px; background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 5px 9px; flex-shrink: 0; min-width: 120px; }
    .lr-item-card.lr-raw { border-color: #1e3a1e; }
    .lr-recipe-box { background: #0d0d1a; border: 1px solid #e8b84b; border-radius: 6px; padding: 6px 9px; text-align: center; flex-shrink: 0; min-width: 72px; }
  </style>
</head>
<body>

<header>
  <h1>⚙ Satisfactory Phase 0 관리자</h1>
  <button class="btn btn-primary" id="run-pipeline-btn" onclick="runPipeline()">파이프라인 실행</button>
  <button class="btn btn-sm" style="background:#333;color:#ccc" onclick="runValidate()">검증 실행</button>
  <span id="pipeline-status" style="font-size:0.8rem;color:#aaa;"></span>
</header>

<div id="validate-banner"></div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('items')">아이템</div>
  <div class="tab" onclick="switchTab('recipes')">레시피</div>
  <div class="tab" onclick="switchTab('buildings')">건물</div>
</div>

<!-- 아이템 패널 -->
<div class="panel active" id="panel-items">
  <div class="stat-row" id="item-stats"></div>
  <div class="toolbar">
    <input type="text" id="item-search" placeholder="이름 또는 ID 검색..." oninput="renderItems()">
    <select id="item-filter" onchange="renderItems()">
      <option value="">전체</option>
      <option value="unclassified">미분류만</option>
      <option value="miner">miner</option>
      <option value="oil_extractor">oil_extractor</option>
      <option value="water_extractor">water_extractor</option>
      <option value="resource_well">resource_well</option>
      <option value="natural">natural</option>
      <option value="byproduct">byproduct</option>
      <option value="manufactured">manufactured</option>
      <option value="other">other</option>
    </select>
    <button class="btn btn-sm btn-primary" onclick="saveAllClassifications()">변경 저장</button>
    <span id="pending-count" style="font-size:0.8rem;color:#e8b84b;"></span>
  </div>
  <table>
    <thead>
      <tr>
        <th style="width:62px">아이콘</th>
        <th>ID</th><th>표시명</th><th>유체</th><th>분류</th><th>생산 건물</th><th>지정</th>
      </tr>
    </thead>
    <tbody id="item-table"></tbody>
  </table>
  <div class="pagination" id="item-pagination"></div>
</div>

<!-- 레시피 패널 -->
<div class="panel" id="panel-recipes">
  <div class="toolbar">
    <input type="text" id="recipe-search" placeholder="레시피 이름 검색..." oninput="renderRecipes()">
    <select id="recipe-type-filter" onchange="renderRecipes()">
      <option value="">전체 타입</option>
      <option value="production">production</option>
      <option value="construction">construction</option>
      <option value="manual">manual</option>
    </select>
    <select id="recipe-filter" onchange="renderRecipes()">
      <option value="">전체 건물</option>
    </select>
  </div>
  <table>
    <thead><tr><th style="width:62px">아이콘</th><th>표시명</th><th>타입</th><th>건물</th><th>시간(s)</th><th>재료</th><th>산물</th></tr></thead>
    <tbody id="recipe-table"></tbody>
  </table>
  <div class="pagination" id="recipe-pagination"></div>
</div>

<!-- 건물 패널 -->
<div class="panel" id="panel-buildings">
  <table>
    <thead><tr><th style="width:62px">아이콘</th><th>ID</th><th>표시명</th><th>카테고리</th><th>전력(MW)</th><th>소머슬롭 슬롯</th></tr></thead>
    <tbody id="building-table"></tbody>
  </table>
</div>

<!-- 건물 상세 모달 -->
<div id="building-modal" class="modal-overlay" onclick="if(event.target===this)closeBuildingModal()">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <span></span>
      <button class="btn btn-sm" style="background:#333;color:#ccc" onclick="closeBuildingModal()">✕ 닫기</button>
    </div>
    <div id="building-modal-body"></div>
  </div>
</div>

<!-- 아이템 상세 모달 -->
<div id="item-modal" class="modal-overlay" onclick="if(event.target===this)closeItemModal()">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <span></span>
      <button class="btn btn-sm" style="background:#333;color:#ccc" onclick="closeItemModal()">✕ 닫기</button>
    </div>
    <div id="item-modal-body"></div>
  </div>
</div>

<!-- 레시피 단계 모달 -->
<div id="recipe-modal" class="modal-overlay" onclick="if(event.target===this)closeRecipeModal()">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-sub" id="modal-meta"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start;flex-shrink:0">
        <button class="btn btn-primary btn-sm" onclick="openChainModal(currentRecipeId)">전체 보기</button>
        <button class="btn btn-sm" style="background:#333;color:#ccc" onclick="closeRecipeModal()">✕ 닫기</button>
      </div>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- 체인 전체 보기 모달 -->
<div id="chain-modal" class="modal-overlay" onclick="if(event.target===this)closeChainModal()">
  <div class="modal" style="max-width:96vw;width:96vw">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="chain-modal-title"></div>
        <div class="modal-sub" id="chain-modal-meta"></div>
      </div>
      <button class="btn btn-sm" style="background:#333;color:#ccc;flex-shrink:0" onclick="closeChainModal()">✕ 닫기</button>
    </div>
    <div id="chain-modal-body"></div>
  </div>
</div>

<script>
// ── 상태 ──────────────────────────────────────────────────────────────
let allItems = [], allRecipes = [], allBuildings = [];
let itemMap = {}, buildingMap = {};
let pendingClassifications = {};
let currentRecipeId = null;
let currentChainRecipeId = null;
let chainRecipeSelections = {};
const PAGE_SIZE = 50;
let itemPage = 0, recipePage = 0;
const RAW_ACQUISITIONS = new Set(['miner','oil_extractor','water_extractor','resource_well']);

// ── /min 계산 헬퍼 ────────────────────────────────────────────────────
function calcRate(amount, duration) {
  if (!duration || duration <= 0) return null;
  return (amount / duration) * 60;
}
function fmtRate(r) {
  if (r == null) return null;
  if (r === Math.floor(r)) return r.toString();
  // 소수점 4자리까지만, 불필요한 0 제거
  return parseFloat(r.toFixed(4)).toString();
}

window.onload = () => { loadAll(); runValidate(); };

async function loadAll() {
  const [iRes, rRes, bRes] = await Promise.all([
    fetch('/api/admin/items').then(r => r.json()),
    fetch('/api/admin/recipes').then(r => r.json()),
    fetch('/api/admin/buildings').then(r => r.json()),
  ]);
  allItems    = iRes.items    || [];
  allRecipes  = rRes.recipes  || [];
  allBuildings = bRes.buildings || [];
  itemMap     = Object.fromEntries(allItems.map(it => [it.id, it]));
  buildingMap = Object.fromEntries(allBuildings.map(b => [b.id, b]));
  buildBuildingFilter();
  renderStats(); renderItems(); renderRecipes(); renderBuildings();
}

// ── 통계 ─────────────────────────────────────────────────────────────
function renderStats() {
  const counts = {};
  allItems.forEach(it => { const a = it.acquisition||'unclassified'; counts[a]=(counts[a]||0)+1; });
  const u = counts['unclassified']||0;
  document.getElementById('item-stats').innerHTML = `
    <div class="stat-card ${u>0?'danger':''}"><div class="label">미분류</div><div class="value">${u}</div></div>
    <div class="stat-card"><div class="label">전체 아이템</div><div class="value">${allItems.length}</div></div>
    <div class="stat-card"><div class="label">레시피</div><div class="value">${allRecipes.length}</div></div>
    <div class="stat-card"><div class="label">건물</div><div class="value">${allBuildings.length}</div></div>`;
}

// ── 아이템 테이블 ─────────────────────────────────────────────────────
function filteredItems() {
  const search = document.getElementById('item-search').value.toLowerCase();
  const filter = document.getElementById('item-filter').value;
  return allItems.filter(it => {
    const matchSearch = !search || it.id.toLowerCase().includes(search) || it.displayName.toLowerCase().includes(search);
    return matchSearch && (!filter || (it.acquisition||'unclassified') === filter);
  });
}

function renderItems() {
  const items = filteredItems();
  const totalPages = Math.ceil(items.length / PAGE_SIZE);
  if (itemPage >= totalPages) itemPage = 0;
  document.getElementById('item-table').innerHTML = items.slice(itemPage*PAGE_SIZE,(itemPage+1)*PAGE_SIZE).map(it => {
    const acq = it.acquisition||'unclassified';
    const pending = pendingClassifications[it.id];
    const iconCell = it.iconPath
      ? `<img class="item-icon" src="/api/admin/icons/${it.iconPath}" alt="${it.displayName}">`
      : `<span class="item-icon-placeholder">?</span>`;
    return `
      <tr class="row-clickable ${acq==='unclassified'?'row-unclassified':''}" onclick="onItemRowClick(event,'${it.id}')">
        <td style="text-align:center">${iconCell}</td>
        <td style="font-family:monospace;font-size:0.78rem;color:#aaa">${it.id}</td>
        <td>${it.displayName}</td>
        <td style="text-align:center">${it.isFluid?'💧':''}</td>
        <td><span class="badge badge-${acq.replace(/_/g,'-')}">${acq}</span></td>
        <td style="color:#888;font-size:0.8rem">${it.producedBy||'—'}</td>
        <td><select class="classify-select ${pending?'changed':''}" data-item="${it.id}"
              onchange="onClassifyChange(this)" onclick="event.stopPropagation()">
          ${acquisitionOptions(pending||acq)}</select></td>
      </tr>`;
  }).join('');
  renderPagination('item-pagination', itemPage, totalPages, p => { itemPage=p; renderItems(); });
  updatePendingCount();
}

function onItemRowClick(e, itemId) {
  if (e.target.tagName==='SELECT'||e.target.tagName==='OPTION') return;
  openItemModal(itemId);
}

function acquisitionOptions(selected) {
  return ['miner','oil_extractor','water_extractor','resource_well','natural','byproduct','manufactured','other','unclassified']
    .map(o => `<option value="${o}" ${o===selected?'selected':''}>${o}</option>`).join('');
}

function onClassifyChange(el) {
  const orig = allItems.find(i=>i.id===el.dataset.item)?.acquisition||'unclassified';
  if (el.value===orig) { delete pendingClassifications[el.dataset.item]; el.classList.remove('changed'); }
  else { pendingClassifications[el.dataset.item]=el.value; el.classList.add('changed'); }
  updatePendingCount();
}

function updatePendingCount() {
  const n = Object.keys(pendingClassifications).length;
  document.getElementById('pending-count').textContent = n>0?`${n}개 변경 미저장`:'';
}

async function saveAllClassifications() {
  const entries = Object.entries(pendingClassifications);
  if (!entries.length) { alert('변경 사항 없음'); return; }
  const btn = document.querySelector('.btn-primary[onclick="saveAllClassifications()"]');
  btn.disabled=true; btn.textContent='저장 중...';
  let ok=0, fail=0;
  for (const [item_id, acquisition] of entries) {
    const res = await fetch('/api/admin/classify', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({item_id,acquisition}) });
    if (res.ok) { const it=allItems.find(i=>i.id===item_id); if(it) it.acquisition=acquisition; delete pendingClassifications[item_id]; ok++; } else fail++;
  }
  btn.disabled=false; btn.textContent='변경 저장';
  alert(fail===0?`${ok}개 저장 완료.`:`${ok}개 저장, ${fail}개 실패`);
  renderStats(); renderItems();
}

function buildBuildingFilter() {
  const select = document.getElementById('recipe-filter');
  const current = select.value;
  const groups = {};
  allBuildings.forEach(b => {
    if (!b.buildingCategory) return;
    if (!groups[b.buildingCategory]) groups[b.buildingCategory] = [];
    groups[b.buildingCategory].push(b);
  });
  const catLabels = { manufacturer: '제조 건물', generator: '발전기' };
  let html = '<option value="">전체 건물</option>';
  for (const cat of Object.keys(groups).sort()) {
    html += `<optgroup label="${catLabels[cat]||cat}">`;
    groups[cat].sort((a,b)=>a.displayName.localeCompare(b.displayName,'ko')).forEach(b => {
      html += `<option value="${b.id}"${b.id===current?' selected':''}>${b.displayName}</option>`;
    });
    html += '</optgroup>';
  }
  select.innerHTML = html;
}

// ── 체인 전체 보기 (LR 트리) ──────────────────────────────────────────
function isUnpackageRecipe(r) {
  return r.slug && r.slug.startsWith('unpackage-');
}

function findPrimaryRecipe(itemId) {
  return allRecipes.find(r => r.recipeType==='production' && !isUnpackageRecipe(r) && r.products.some(p=>p.item===itemId));
}

function getAltRecipes(itemId) {
  return allRecipes.filter(r => r.recipeType==='production' && !isUnpackageRecipe(r) && r.products.some(p=>p.item===itemId));
}

function findChainRecipe(itemId) {
  const selId = chainRecipeSelections[itemId];
  if (selId) {
    const sel = allRecipes.find(r => r.id === selId);
    if (sel) return sel;
  }
  return findPrimaryRecipe(itemId);
}

function switchChainRecipe(itemId, recipeId) {
  chainRecipeSelections[itemId] = recipeId;
  renderChainBody(currentChainRecipeId);
}

// 체인 전체에서 재료로 사용되는 아이템 ID 집합 수집
function collectChainIngredients(recipeId, visited = new Set()) {
  const r = allRecipes.find(r => r.id === recipeId);
  if (!r || visited.has(recipeId)) return new Set();
  visited.add(recipeId);
  const items = new Set();
  for (const ing of (r.ingredients || [])) {
    items.add(ing.item);
    const sub = findChainRecipe(ing.item);
    if (sub) {
      for (const id of collectChainIngredients(sub.id, visited)) items.add(id);
    }
  }
  return items;
}

function makeLRItemCard(itemId, amount, parentDuration, acquisition, alreadyVisited) {
  const it = itemMap[itemId]||{displayName:itemId,iconPath:null,acquisition};
  const isRaw = RAW_ACQUISITIONS.has(it.acquisition||acquisition);
  const ico = it.iconPath
    ? `<img style="width:30px;height:30px;object-fit:contain;flex-shrink:0" src="/api/admin/icons/${it.iconPath}" alt="">`
    : `<span style="width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:#444;font-size:14px;flex-shrink:0">?</span>`;
  const rate = calcRate(amount, parentDuration);
  const rateEl = rate != null ? `<div style="font-size:0.62rem;color:#7ab8b8;margin-top:1px">${fmtRate(rate)}/min</div>` : '';
  const badge = isRaw
    ? `<span class="badge badge-${((it.acquisition||acquisition)||'').replace(/_/g,'-')}" style="font-size:0.58rem;margin-top:2px;display:block">${it.acquisition||acquisition||'?'}</span>`
    : (alreadyVisited ? `<span style="font-size:0.68rem;color:#c0392b;display:block;margin-top:2px">⟳</span>` : '');
  return `<div class="lr-item-card${isRaw?' lr-raw':''}">
    ${ico}
    <div style="min-width:0">
      <div style="font-size:0.78rem;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px">${it.displayName}</div>
      <div style="font-size:0.82rem;font-weight:700;color:#e8b84b">×${amount}</div>
      ${rateEl}${badge}
    </div>
  </div>`;
}

function makeByproductCard(bp, recipeDuration, chainIngredients) {
  const it = itemMap[bp.item]||{displayName:bp.item,iconPath:null};
  const isUsed = chainIngredients.has(bp.item);
  const ico = it.iconPath
    ? `<img style="width:26px;height:26px;object-fit:contain;flex-shrink:0" src="/api/admin/icons/${it.iconPath}" alt="">`
    : `<span style="width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;color:#444;font-size:12px;flex-shrink:0">?</span>`;
  const rate = calcRate(bp.amount, recipeDuration);
  const rateEl = rate != null ? `<div style="font-size:0.58rem;color:#7ab8b8">${fmtRate(rate)}/min</div>` : '';
  const usedEl = isUsed ? `<div style="font-size:0.58rem;color:#4caf50;margin-top:1px">↑ 체인 사용</div>` : '';
  return `<div class="lr-item-card" style="opacity:${isUsed?'1':'0.3'};border-color:${isUsed?'#2a4a2a':'#1e1e2a'};min-width:100px;${isUsed?'':'filter:blur(0.5px)'}">
    ${ico}
    <div style="min-width:0">
      <div style="font-size:0.72rem;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:85px">${it.displayName}</div>
      <div style="font-size:0.75rem;font-weight:700;color:#e8b84b">×${bp.amount}</div>
      ${rateEl}${usedEl}
    </div>
  </div>`;
}

function renderLRNode(itemId, amount, parentDuration, visited, chainIngredients) {
  const it = itemMap[itemId]||{displayName:itemId,iconPath:null,acquisition:null};
  const isRaw = RAW_ACQUISITIONS.has(it.acquisition);
  const alreadyVisited = visited.has(itemId);
  const recipe = (!isRaw && !alreadyVisited) ? findChainRecipe(itemId) : null;

  const itemCard = makeLRItemCard(itemId, amount, parentDuration, it.acquisition, alreadyVisited);

  if (!recipe || alreadyVisited) {
    return `<div class="lr-node">${itemCard}</div>`;
  }

  const newVisited = new Set(visited);
  newVisited.add(itemId);

  const dur = recipe.manufactoringDuration;
  const bname = (recipe.producedIn||[]).map(id=>buildingMap[id]?.displayName||id).filter(Boolean).join('/')||recipe.buildingCategory||'?';
  const outAmount = recipe.products.find(p=>p.item===itemId)?.amount || amount;
  const outRate = calcRate(outAmount, dur);

  const altRecipes = getAltRecipes(itemId);
  const escapedId = itemId.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const recipeSelector = altRecipes.length > 1
    ? `<select onchange="switchChainRecipe('${escapedId}',this.value)"
         style="margin-top:4px;width:100%;background:#0a0a15;color:#ccc;border:1px solid #e8b84b55;border-radius:3px;padding:1px 3px;font-size:0.6rem;cursor:pointer">
         ${altRecipes.map(ar=>`<option value="${ar.id}"${ar.id===recipe.id?' selected':''}>${ar.displayName}</option>`).join('')}
       </select>`
    : '';

  const recipeBox = `<div class="lr-recipe-box">
    <div style="font-size:0.68rem;color:#aaa;white-space:nowrap">${bname}</div>
    <div style="font-size:0.78rem;font-weight:700;color:#e8b84b;margin-top:2px">${dur}s</div>
    ${outRate != null ? `<div style="font-size:0.62rem;color:#7ab8b8;margin-top:1px">${fmtRate(outRate)}/min</div>` : ''}
    ${recipeSelector}
  </div>`;

  const childrenHtml = recipe.ingredients.map(ing=>renderLRNode(ing.item,ing.amount,dur,newVisited,chainIngredients)).join('');

  // 부산물 표시
  const byproducts = recipe.byproducts || [];
  const byproductSection = byproducts.length
    ? `<div style="font-size:0.6rem;color:#556;text-transform:uppercase;letter-spacing:0.05em;padding:2px 4px;border-top:1px solid #1e1e2e;margin-top:2px">부산물</div>
       ${byproducts.map(bp => makeByproductCard(bp, dur, chainIngredients)).join('')}`
    : '';

  const outputCol = byproducts.length
    ? `<div class="lr-col-group" style="gap:3px">${itemCard}${byproductSection}</div>`
    : itemCard;

  return `<div class="lr-node">
    <div class="lr-col-group lr-ing-group">${childrenHtml}</div>
    <div class="lr-arrow">→</div>
    ${recipeBox}
    <div class="lr-arrow">→</div>
    ${outputCol}
  </div>`;
}

function renderChainBody(recipeId) {
  const r = allRecipes.find(r=>r.id===recipeId); if (!r) return;
  const rootDur = r.manufactoringDuration;
  const chainIngredients = collectChainIngredients(recipeId);

  const productsHtml = r.products.map(p => {
    const it = itemMap[p.item]||{displayName:p.item,iconPath:null};
    const ico = it.iconPath
      ? `<img style="width:36px;height:36px;object-fit:contain;flex-shrink:0" src="/api/admin/icons/${it.iconPath}" alt="">`
      : `<span style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:#444;font-size:18px;flex-shrink:0">?</span>`;
    const rate = calcRate(p.amount, rootDur);
    const rateEl = rate != null ? `<div style="font-size:0.78rem;color:#7ab8b8;margin-top:2px">${fmtRate(rate)}/min</div>` : '';
    return `<div class="lr-item-card" style="border-color:#e8b84b;padding:8px 12px">
      ${ico}
      <div>
        <div style="font-size:0.88rem;font-weight:600;color:#e0e0e0">${it.displayName}</div>
        <div style="font-size:0.95rem;font-weight:700;color:#e8b84b">×${p.amount}</div>
        ${rateEl}
      </div>
    </div>`;
  }).join('');

  const rootByproducts = (r.byproducts||[]).map(bp => makeByproductCard(bp, rootDur, chainIngredients)).join('');
  const rootByproductSection = rootByproducts
    ? `<div style="display:flex;flex-direction:column;gap:3px;margin-top:4px">
         <div style="font-size:0.6rem;color:#556;text-transform:uppercase;letter-spacing:0.05em;padding:2px 4px;border-top:1px solid #1e1e2e">부산물</div>
         ${rootByproducts}
       </div>`
    : '';

  const mainBname = (r.producedIn||[]).map(id=>buildingMap[id]?.displayName||id).filter(Boolean).join('/')||r.buildingCategory||'?';
  const mainRecipeBox = `<div class="lr-recipe-box" style="border-width:2px;padding:9px 12px;min-width:90px">
    <div style="font-size:0.75rem;color:#aaa;white-space:nowrap">${mainBname}</div>
    <div style="font-size:0.9rem;font-weight:700;color:#e8b84b;margin-top:3px">${rootDur}s</div>
  </div>`;

  const ingredientSubtrees = r.ingredients.map(ing=>renderLRNode(ing.item,ing.amount,rootDur,new Set(),chainIngredients)).join('');

  document.getElementById('chain-modal-body').innerHTML = `
    <div class="lr-chain">
      <div class="lr-node" style="align-items:center">
        <div class="lr-col-group lr-ing-group">${ingredientSubtrees}</div>
        <div class="lr-arrow" style="font-size:1.3rem;padding:0 4px">→</div>
        ${mainRecipeBox}
        <div class="lr-arrow" style="font-size:1.3rem;padding:0 4px">→</div>
        <div class="lr-col-group">${productsHtml}${rootByproductSection}</div>
      </div>
    </div>`;
}

function openChainModal(recipeId) {
  const r = allRecipes.find(r=>r.id===recipeId); if (!r) return;
  currentChainRecipeId = recipeId;
  chainRecipeSelections = {};

  const buildingNames = (r.producedIn||[]).map(id=>buildingMap[id]?.displayName||id).filter(Boolean).join(' / ');
  document.getElementById('chain-modal-title').textContent = r.displayName + ' — 재료 체인';
  document.getElementById('chain-modal-meta').textContent  = `${buildingNames||r.buildingCategory||'미지정'} · ${r.manufactoringDuration}초`;

  renderChainBody(recipeId);
  document.getElementById('chain-modal').classList.add('active');
}
function closeChainModal() { document.getElementById('chain-modal').classList.remove('active'); }

// ── 검증/파이프라인 ────────────────────────────────────────────────────
async function runValidate() {
  const banner = document.getElementById('validate-banner');
  banner.style.display = 'none';
  try {
    const res = await fetch('/api/admin/validate').then(r=>r.json());
    banner.style.display = 'block';
    if (res.valid) {
      banner.className='banner-ok';
      banner.innerHTML=`✅ 검증 통과 — 경고 ${res.warnings.length}건`;
    } else {
      banner.className='banner-fail';
      banner.innerHTML=`❌ 검증 실패 (오류 ${res.errors.length}건)`+res.errors.slice(0,5).map(e=>`<div>✖ ${e}</div>`).join('');
    }
  } catch(e) {
    banner.style.display='block'; banner.className='banner-warn';
    banner.innerHTML=`⚠ 검증 실행 실패: ${e.message}`;
  }
}

async function runPipeline() {
  const btn=document.getElementById('run-pipeline-btn'), status=document.getElementById('pipeline-status');
  btn.disabled=true; status.textContent='실행 중...';
  try {
    const res=await fetch('/api/admin/pipeline/run',{method:'POST'}).then(r=>r.json());
    if (res.ok) { status.textContent='완료 ✓'; await loadAll(); await runValidate(); }
    else { status.textContent=`실패 (code ${res.returncode})`; alert('파이프라인 오류:\n'+(res.stderr||res.error||'')); }
  } catch(e) { status.textContent='오류'; alert('파이프라인 실행 오류: '+e.message); }
  btn.disabled=false;
  setTimeout(()=>{ status.textContent=''; }, 4000);
}

function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
  document.querySelectorAll('.tab')[['items','recipes','buildings'].indexOf(name)].classList.add('active');
}

function renderPagination(containerId, current, total, onPageChange) {
  const el = document.getElementById(containerId);
  if (total<=1) { el.innerHTML=''; return; }
  const pages=[];
  pages.push(`<button class="page-btn" ${current===0?'disabled':''} onclick="(${onPageChange})(${current-1})">◀</button>`);
  for (let i=0;i<total;i++) {
    if (i===0||i===total-1||Math.abs(i-current)<=2)
      pages.push(`<button class="page-btn ${i===current?'active':''}" onclick="(${onPageChange})(${i})">${i+1}</button>`);
    else if (Math.abs(i-current)===3) pages.push('<span style="color:#555">…</span>');
  }
  pages.push(`<button class="page-btn" ${current===total-1?'disabled':''} onclick="(${onPageChange})(${current+1})">▶</button>`);
  el.innerHTML=pages.join('');
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closeChainModal(); closeRecipeModal(); closeItemModal(); closeBuildingModal(); }
});
</script>
