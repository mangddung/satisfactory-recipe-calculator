services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 포트 미개방: nginx(frontend)가 내부 네트워크로 /api/ 를 프록시
    volumes:
      - plans:/app/backend/data/plans
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  plans:
