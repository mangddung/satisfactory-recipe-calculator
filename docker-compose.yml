services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "38050:5000"
    volumes:
      - ./backend:/app/backend
      - ./data-pipeline:/app/data-pipeline
      - ./game-data:/app/game-data
    environment:
      FLASK_DEBUG: "1"
      ENABLE_ADMIN: "1"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    ports:
      - "38173:3000"
    volumes:
      - ./frontend:/app
      - frontend_nm:/app/node_modules
    environment:
      BACKEND_URL: "http://backend:5000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  frontend_nm:
